# Test-only configuration.
#
# The real src/main/resources/application.properties is git-ignored (it holds
# the MySQL credentials), so on a clean checkout / in CI this file is the ONLY
# application.properties on the classpath during `mvn test`. Keep it
# self-contained.

# In-memory H2, thrown away when the JVM exits. MySQL compatibility mode keeps
# the few MySQL-isms in the entities (TEXT / TINYINT column definitions) happy.
spring.datasource.url=jdbc:h2:mem:foodapp;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Prod runs ddl-auto=validate against a hand-written schema.sql; tests have no
# such schema, so let Hibernate build it from the @Entity classes instead.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Don't pin MySQLDialect here - Hibernate detects H2 on its own.
