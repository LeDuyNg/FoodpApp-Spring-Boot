<!DOCTYPE html>
<!--
  Rendered by RecipeController.mine()  (GET /recipes/mine).

  Model contract:
    recipes : List<Recipe> — REQUIRED (may be empty). Get these with
                             recipeRepository.findByUserId(currentUser.getId())
                             via the service.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My recipes')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main>
    <div class="container py-4">

        <div class="d-flex flex-wrap justify-content-between align-items-end mb-4 gap-3">
            <div>
                <div class="hero-eyebrow mb-2"><i class="bi bi-journal-bookmark me-1"></i> Your recipe box</div>
                <h1 class="display-6 mb-1">Everything you've written down</h1>
                <p class="text-muted-warm mb-0"
                   th:text="${#lists.size(recipes)} + (${#lists.size(recipes)} == 1
                            ? ' recipe in your collection' : ' recipes in your collection')">
                    3 recipes in your collection
                </p>
            </div>
            <a th:href="@{/recipes/new}" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i> Add a new one
            </a>
        </div>

        <div class="row g-4" th:if="${not #lists.isEmpty(recipes)}">
            <div th:each="r : ${recipes}" th:replace="~{fragments/layout :: recipeCard(${r})}"></div>
        </div>

        <div th:if="${#lists.isEmpty(recipes)}" class="empty-state">
            <i class="bi bi-journal-plus"></i>
            <h3 class="h5">Your recipe box is empty</h3>
            <p class="mb-3">Every good collection starts somewhere. What do you cook most?</p>
            <a th:href="@{/recipes/new}" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i> Write your first recipe
            </a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
