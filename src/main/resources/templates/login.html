<!DOCTYPE html>
<!--
  Rendered by AuthController.loginPage()  (GET /login).

  The POST is handled entirely by Spring Security's form-login filter — no
  controller method, no th:object, no DTO. The filter reads the request
  parameters directly, which is why the inputs use plain name="email" /
  name="password" instead of th:field.

  name="email" must match SecurityConfig's .usernameParameter("email").
  The CSRF hidden input is added automatically because this is th:action.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Welcome back')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main>
    <div class="container">
        <div class="auth-shell">

            <div class="text-center mb-4">
                <div class="hero-eyebrow mb-2">Welcome back</div>
                <h1 class="display-6">Good to see you again</h1>
                <p class="text-muted-warm">Your recipe box is right where you left it.</p>
            </div>

            <div class="auth-card">

                <!-- ?error is appended by Spring Security on a failed login -->
                <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span>That email and password didn't match. Try again?</span>
                </div>

                <!-- ?logout is appended by the logout success handler -->
                <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <span>You're logged out. See you soon!</span>
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white" style="border-color: var(--line);">
                                <i class="bi bi-envelope text-muted-warm"></i>
                            </span>
                            <input type="email" class="form-control" id="email" name="email"
                                   placeholder="you@kitchen.com" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white" style="border-color: var(--line);">
                                <i class="bi bi-key text-muted-warm"></i>
                            </span>
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2">
                        <i class="bi bi-door-open me-1"></i> Log in
                    </button>
                </form>

                <hr class="my-4" style="border-color: var(--line);">

                <p class="text-center mb-0 text-muted-warm">
                    New around here?
                    <a th:href="@{/register}" class="fw-bold">Create an account</a>
                </p>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
