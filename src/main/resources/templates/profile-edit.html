<!DOCTYPE html>
<!--
  Rendered by ProfileController.editForm() (GET /profile/edit) and
  re-rendered by ProfileController.update() (POST /profile) on errors.

  Model contract:
    form : UpdateProfileForm — REQUIRED, pre-filled with the CURRENT username
                               and email, password left blank.

  Unlike RegisterForm, a blank password here means "leave my password alone"
  — that rule lives in UserService.updateProfile(), not in the DTO, because
  "blank OR at least 8 characters" can't be expressed with @NotBlank/@Size.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit profile')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main>
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-6">

                <a th:href="@{/profile}" class="text-muted-warm small d-inline-block mb-3">
                    <i class="bi bi-arrow-left me-1"></i> Back to my profile
                </a>

                <div class="mb-4">
                    <div class="hero-eyebrow mb-2"><i class="bi bi-person-gear me-1"></i> Settings</div>
                    <h1 class="display-6 mb-1">Edit your profile</h1>
                    <p class="text-muted-warm">Change what people see, or set a new password.</p>
                </div>

                <div class="card-warm p-4">
                    <form th:action="@{/profile}" th:object="${form}" method="post" novalidate>

                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white" style="border-color: var(--line);">
                                    <i class="bi bi-person text-muted-warm"></i>
                                </span>
                                <input type="text" class="form-control" id="username" th:field="*{username}">
                            </div>
                            <span class="field-error" th:if="${#fields.hasErrors('username')}"
                                  th:errors="*{username}">Username error</span>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white" style="border-color: var(--line);">
                                    <i class="bi bi-envelope text-muted-warm"></i>
                                </span>
                                <input type="email" class="form-control" id="email" th:field="*{email}">
                            </div>
                            <span class="field-error" th:if="${#fields.hasErrors('email')}"
                                  th:errors="*{email}">Email error</span>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">New password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white" style="border-color: var(--line);">
                                    <i class="bi bi-key text-muted-warm"></i>
                                </span>
                                <input type="password" class="form-control" id="password"
                                       th:field="*{password}" placeholder="Leave blank to keep the current one"
                                       autocomplete="new-password">
                            </div>
                            <div class="form-text">Only fill this in if you want to change it.</div>
                            <span class="field-error" th:if="${#fields.hasErrors('password')}"
                                  th:errors="*{password}">Password error</span>
                        </div>

                        <div class="alert alert-success d-flex align-items-start" role="note">
                            <i class="bi bi-info-circle-fill me-2 mt-1"></i>
                            <small class="mb-0">
                                Changing your email or password logs you out, so you can sign back
                                in with the new details.
                            </small>
                        </div>

                        <div class="d-flex gap-2 justify-content-end">
                            <a th:href="@{/profile}" class="btn btn-soft">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check2 me-1"></i> Save changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
