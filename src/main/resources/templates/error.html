<!DOCTYPE html>
<!--
  Spring Boot renders templates/error.html automatically for any unhandled
  error, replacing the default "Whitelabel Error Page". No controller and no
  mapping needed — the name "error" is the convention.

  Spring puts these attributes on the model for you:
    status  : int    (404, 403, 500, …)
    error   : String (the reason phrase, e.g. "Not Found")
    message : String (often empty unless server.error.include-message=always)
    path    : String (the URL that failed)

  This page does NOT include the flash fragment, because that fragment also
  reads ${error} — which means something different here.

  Remember: the real stack trace is always in the application console log,
  even when the browser only shows this page.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Something went wrong')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card-warm p-5 text-center">

                    <i class="bi bi-cup-hot" style="font-size: 4rem; color: var(--terracotta); opacity: 0.6;"></i>

                    <div class="display-4 mt-3 mb-1" th:text="${status}">404</div>

                    <!-- A friendlier line per status, falling back to the generic one -->
                    <h1 class="h4 mb-3" th:switch="${status}">
                        <span th:case="404">We couldn't find that page</span>
                        <span th:case="403">That one's not yours to open</span>
                        <span th:case="500">Something boiled over in the kitchen</span>
                        <span th:case="*" th:text="${error}">Unexpected error</span>
                    </h1>

                    <p class="text-muted-warm mb-1" th:if="${message != null and !#strings.isEmpty(message)}"
                       th:text="${message}">Details.</p>

                    <p class="text-muted-warm small mb-4" th:if="${path}">
                        <code th:text="${path}">/recipes/999</code>
                    </p>

                    <div class="d-flex gap-2 justify-content-center flex-wrap">
                        <a th:href="@{/home}" class="btn btn-primary">
                            <i class="bi bi-house-heart me-1"></i> Take me home
                        </a>
                        <a th:href="@{/recipes}" class="btn btn-soft">
                            <i class="bi bi-search me-1"></i> Browse recipes
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
